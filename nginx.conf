worker_processes 1;

events {
    worker_connections 64;
}

http {
    limit_req_zone $binary_remote_addr zone=llm_api:1m rate=5r/m;

    upstream llama_backend {
        server llama-server:8080;
    }

    server {
        listen 80;
        client_max_body_size 2m;

        location ~ ^/(completion|v1/chat/completions|v1/completions|v1/responses)$ {
            limit_req zone=llm_api burst=2 nodelay;
            limit_req_status 429;

            proxy_pass http://llama_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://llama_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}